<!-- Purpose: displays a real-WASM smoke test for the 20-bar crossover. Connects: wasm-pack output to visible browser results. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoTrace WASM engine check</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; }
      dt { font-weight: 700; margin-top: 1rem; }
      dd { margin-left: 0; }
      #status[data-state="error"] { color: #a21d1d; }
      #status[data-state="success"] { color: #176b36; }
    </style>
  </head>
  <body>
    <h1>20-bar crossover: real WASM check</h1>
    <p id="status" role="status" aria-live="polite">Loading the compiled engine…</p>
    <dl>
      <dt>Final equity</dt><dd id="final-equity">—</dd>
      <dt>Closed trades</dt><dd id="trade-count">—</dd>
      <dt>Total charges</dt><dd id="total-charges">—</dd>
    </dl>
    <script type="module" src="./wasm-test.ts"></script>
  </body>
</html>
