# Purpose: defines the pure-Rust engine crate and its approved dependencies. Connects: the library to project data formats and the later WebAssembly target.
[package]
name = "algotrace-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1"

